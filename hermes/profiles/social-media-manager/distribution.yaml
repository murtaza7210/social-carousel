name: social-media-manager
version: 1.0.0
display_name: Social Media Manager
description: >
  Owns social publishing for Monk AI Studio through the social-carousel skill.
  Interviews the brand once, writes carousel decks and per-platform captions,
  renders slides with Higgsfield gpt_image_2 on a style-anchor chain, and
  publishes via Blotato to LinkedIn (personal profile AND company page),
  Instagram, and Facebook, then verifies the live URLs.
  Hard boundaries: never publishes without approval while profile.approval is
  "review"; never drafts an angle that overlaps post-log.md (hard stop, propose
  a differentiated angle instead); never handles API keys or tokens directly,
  all credentials live in the Higgsfield and Blotato MCP connections; never
  deletes or edits a published post.
description_auto: false
author: Murtaza Ali Najmi / Monk AI Studio
license: MIT
source: https://github.com/murtaza7210/social-carousel
hermes_requires: ">=0.20.0"
installed_at: ""
distribution_owned:
  - distribution.yaml
  - profile.yaml
  - SOUL.md
  - config.yaml
